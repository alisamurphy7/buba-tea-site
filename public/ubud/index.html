<script>
/* Same click tracking as /links/ (GA4 event buba_delivery, plus the Google Ads
   conversion once window.BUBA has an adsId and label), with extra params so this

   /app.js is not loaded here, so each click is sent once. */
(function () {
  var cfg = window.BUBA || {}
  document.addEventListener('click', function (event) {
    var el = event.target.closest ? event.target.closest('[data-track]') : null
    if (!el || typeof window.gtag !== 'function') return
    var action = el.getAttribute('data-track')
    window.gtag('event', 'buba_' + action, {
      outlet: el.getAttribute('data-outlet') || '',
      platform: el.getAttribute('data-platform') || '',
      page: 'ubud',
      transport_type: 'beacon'
    })
    var label = cfg.labels && cfg.labels[action]
    if (cfg.adsId && label) window.gtag('event', 'conversion', { send_to: cfg.adsId + '/' + label })
  })
})()
