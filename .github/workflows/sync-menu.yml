# Синхронизация меню с Poster и выкладка сайта.
#
# Заменяет локальный LaunchAgent: раньше это делал Mac, и пока он спал,
# сайт стоял на старом меню. Здесь запуск не зависит ни от чьего компьютера.
#
# Расписание — раз в два часа. Часовой пояс не важен: запуск в начале чётного часа.
# GitHub не гарантирует минуту в минуту — при высокой нагрузке прогон может
# сдвинуться на несколько минут, а иногда и пропуститься. Для меню это не страшно.
#
# Раз в два часа, а не каждый час, ради лимита Actions: на приватном репозитории
# бесплатно 2000 минут в месяц, а каждый прогон тарифицируется минимум как минута.
# Ежечасно вышло бы ~720 минут, здесь ~360 — остаётся запас на другие проекты.
#
# Запустить руками: вкладка Actions → «Меню из Poster» → Run workflow.

name: Меню из Poster

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

# Нужно, чтобы задача могла закоммитить обновлённый content/menu.json.
permissions:
  contents: write

# Две одновременные выкладки одного сайта не нужны.
concurrency:
  group: menu-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # npm install не нужен: у сайта нет зависимостей, только Node.

      - name: Забрать меню из кассы
        env:
          POSTER_TOKEN: ${{ secrets.POSTER_TOKEN }}
          POSTER_ACCOUNT_ID: ${{ secrets.POSTER_ACCOUNT_ID }}
        run: npm run sync

      # Дальше работаем, только если меню правда изменилось: каждая выкладка
      # создаёт новую версию в Cloudflare и сбрасывает кэш у посетителей.
      - name: Проверить, изменилось ли меню
        id: changed
        run: |
          if git diff --quiet -- content/menu.json; then
            echo "result=no" >> "$GITHUB_OUTPUT"
            echo "Меню не менялось — собирать и выкладывать нечего."
          else
            echo "result=yes" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- content/menu.json
          fi

      - name: Собрать сайт
        if: steps.changed.outputs.result == 'yes'
        run: npm run build

      - name: Проверить сборку
        if: steps.changed.outputs.result == 'yes'
        run: npm run check

      - name: Выложить в Cloudflare Pages
        if: steps.changed.outputs.result == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=buba-tea --branch=main --commit-dirty=true

      - name: Сохранить новое меню в репозиторий
        if: steps.changed.outputs.result == 'yes'
        run: |
          git config user.name  "buba-tea-bot"
          git config user.email "bot@bubateabali.com"
          git add content/menu.json
          git commit -m "Меню из Poster: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
